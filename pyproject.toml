[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expense-auditor"
version = "0.1.0"
description = "Local reconciliation of outgoing bank transactions against receipts and invoices."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf",
    "pillow",
    "opencv-python-headless",
    "pytesseract",
    "pandas",
    "openpyxl",
    "rapidfuzz",
    "pydantic>=2",
    "pyyaml",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/expense_auditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["expense_auditor"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["cv2", "fitz", "pymupdf"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytesseract", "pytesseract.*", "yaml"]
ignore_missing_imports = true
follow_imports = "skip"
